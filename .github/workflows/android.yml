name: Android build & engine tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Engine self-tests (pure JVM, no Android SDK needed)
        run: gradle :engine:engineSelfTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Generate throwaway signing key + build signed release APK
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/flashguard.jks" \
            -alias flashguard -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass flashguard -keypass flashguard \
            -dname "CN=FlashGuard, OU=Arena Agent Build, O=FlashGuard, L=NA, ST=NA, C=NA"
          gradle :app:assembleRelease --stacktrace
        env:
          FLASHGUARD_KEYSTORE: ${{ runner.temp }}/flashguard.jks
          FLASHGUARD_KEYSTORE_PASS: flashguard
          FLASHGUARD_KEY_ALIAS: flashguard
          FLASHGUARD_KEY_PASS: flashguard

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FlashGuard-APKs
          path: dist/*.apk
          if-no-files-found: error
